  <text x="24" y="184" class="bad">fail  H3  blog  any site can frame the page (clickjacking)…</text>
  <text x="24" y="212" class="dim">warn  H5  blog  the browser default decides how much of the…</text>
  <text x="24" y="240" class="bad">fail  H7  blog  plain http is served without a redirect to…</text>
  <text x="24" y="268" class="bad">fail  T2  blog  subscribers: open to anonymous reads (GET h…</text>
  <text x="24" y="296" class="bad">FAIL: 4 failing, 2 warning, 17 passing, 0 errors; report re…</text>
  <text x="24" y="324" class="bad">exit 1</text>
  <text x="24" y="352"><tspan class="p">$</tspan><tspan class="cmd" dx="8">grep -h subscribers reports/*.md | tr '|' '\n' | sed -n \</tspan></text>
  <text x="24" y="380" class="cmd">    '2,7p'</text>
