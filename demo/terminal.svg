<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 744" role="img" aria-labelledby="t d" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16" xml:space="preserve">
  <title id="t">surface-audit</title>
  <desc id="d">surface-audit grades two demo surfaces served by a local fake server: one clean, one with three header failures and a table open to anonymous reads.</desc>
