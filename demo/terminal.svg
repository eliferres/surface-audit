  <text x="24" y="520" class="dim"> 200, 1 row </text>
  <text x="24" y="548" class="dim"> subscribers: open to anonymous reads </text>
  <text x="24" y="576"><tspan class="p">$</tspan><tspan class="cmd" dx="8">echo '{&quot;surfaces&quot;: []}' &gt; empty.json; python3 -m \</tspan></text>
  <text x="24" y="604" class="cmd">    surface_audit run empty.json; echo &quot;exit $?&quot;</text>
