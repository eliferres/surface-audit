  <circle cx="70" cy="20" r="6" fill="#28c840"/>
  <text x="92" y="26" class="dim" font-size="14">surface-audit</text>
  <text x="24" y="72"><tspan class="p">$</tspan><tspan class="cmd" dx="8">python3 demo/fake_site.py python3 -m surface_audit run \</tspan></text>
