name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Audit the demo surfaces
        run: |
          python demo/fake_site.py python -m surface_audit run demo/surfaces.json && code=0 || code=$?
          [ "$code" = 1 ] || { echo "the demo run exited $code, expected 1"; exit 1; }
          echo '{"surfaces": []}' > empty.json
          python -m surface_audit run empty.json && code=0 || code=$?
          [ "$code" = 2 ] || { echo "the empty config exited $code, expected 2"; exit 1; }
      - name: Install and run the console script
        run: |
          python -m pip install .
          surface-audit --version
          python demo/fake_site.py surface-audit run demo/surfaces.json --json && code=0 || code=$?
          [ "$code" = 1 ] || { echo "the installed command exited $code, expected 1"; exit 1; }
